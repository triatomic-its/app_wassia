<a [routerLink]="link()" [class]="classes">
  @if (icon(); as name) {
    <span [class]="iconClasses()" aria-hidden="true"><ng-icon [name]="name" size="20" /></span>
  }
  <span class="min-w-0 flex-1">
    <ng-content />
  </span>
  <span class="flex shrink-0 items-center gap-0.5 text-sm font-bold text-sapin">
    {{ actionLabel() }}<ng-icon name="lucideChevronRight" size="18" aria-hidden="true" />
  </span>
</a>
