<app-field label="Nom" for="en-last-name" [required]="true" [error]="errors().lastName">
  <input
    id="en-last-name"
    appInput
    autocomplete="family-name"
    autocapitalize="characters"
    placeholder="KONÉ"
    [formControl]="form().controls.lastName"
    [attr.aria-invalid]="!!errors().lastName"
    aria-describedby="en-last-name-msg"
  />
</app-field>

<app-field label="Prénoms" for="en-first-names" [required]="true" [error]="errors().firstNames">
  <input
    id="en-first-names"
    appInput
    autocomplete="given-name"
    placeholder="Awa Mariam"
    [formControl]="form().controls.firstNames"
    [attr.aria-invalid]="!!errors().firstNames"
    aria-describedby="en-first-names-msg"
  />
</app-field>

<app-field label="Téléphone" for="en-phone" [required]="true" [error]="errors().phone">
  <input
    id="en-phone"
    appInput
    type="tel"
    inputmode="tel"
    autocomplete="tel"
    placeholder="07 00 00 00 00"
    [formControl]="form().controls.phone"
    (blur)="phoneLeft.emit()"
    [attr.aria-invalid]="!!errors().phone"
    aria-describedby="en-phone-msg"
  />
</app-field>
<app-phone-check-status [check]="phoneCheck()" />

<app-field label="Marché" for="en-market" [required]="true" [error]="errors().market">
  <select
    id="en-market"
    appInput
    [formControl]="form().controls.market"
    [attr.aria-invalid]="!!errors().market"
    aria-describedby="en-market-msg"
  >
    <option value="" disabled>Choisir le marché</option>
    @for (m of markets(); track m.value) {
      <option [value]="m.value">{{ m.label }}</option>
    }
  </select>
</app-field>

<app-field label="Numéro d'étal (facultatif)" for="en-stall" hint="Exemple : Allée B, étal 12">
  <input
    id="en-stall"
    appInput
    [formControl]="form().controls.stall"
    aria-describedby="en-stall-msg"
  />
</app-field>
