<div class="grid grid-cols-2 gap-2.5">
  <app-photo-capture
    label="Pièce d'identité"
    [url]="photoUrls().idDocUrl"
    [busy]="uploads().idDocUrl.busy"
    [error]="uploads().idDocUrl.error ?? errors().idDocUrl"
    (picked)="photoPicked.emit({ field: 'idDocUrl', file: $event })"
  />
  <app-photo-capture
    label="Photo de l'étalage ou du commerce"
    [url]="photoUrls().photoUrl"
    [busy]="uploads().photoUrl.busy"
    [error]="uploads().photoUrl.error ?? errors().photoUrl"
    (picked)="photoPicked.emit({ field: 'photoUrl', file: $event })"
  />
</div>

<app-field label="Pièce d'identité" for="en-id-type" [required]="true" [error]="errors().idType">
  <select
    id="en-id-type"
    appInput
    [formControl]="form().controls.idType"
    aria-describedby="en-id-type-msg"
  >
    @for (t of idTypes; track t.value) {
      <option [value]="t.value">{{ t.label }}</option>
    }
  </select>
</app-field>

<app-field label="Numéro de la pièce" for="en-id" [required]="true" [error]="errors().idNumber">
  <input
    id="en-id"
    appInput
    autocapitalize="characters"
    placeholder="CI 0000 0000"
    [formControl]="form().controls.idNumber"
    [attr.aria-invalid]="!!errors().idNumber"
    aria-describedby="en-id-msg"
  />
</app-field>

<app-field label="Secteur d'activité" for="en-sector" [required]="true" [error]="errors().sector">
  <select
    id="en-sector"
    appInput
    [formControl]="form().controls.sector"
    [attr.aria-invalid]="!!errors().sector"
    aria-describedby="en-sector-msg"
  >
    <option value="" disabled>Choisir le secteur</option>
    @for (s of sectors(); track s.value) {
      <option [value]="s.value">{{ s.label }}</option>
    }
  </select>
</app-field>
