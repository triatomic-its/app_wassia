<a
  href="#main"
  class="sr-only z-50 rounded-control bg-accent px-4 py-3 font-bold text-night focus:not-sr-only focus:fixed focus:top-2 focus:left-2"
  >{{ t.layout.skipToContent }}</a
>

<!-- Desktop side menu (collapsible: 256 px / 84 px) -->
<nav
  class="sticky top-0 hidden h-dvh shrink-0 flex-col overflow-y-auto scrollbar-nav bg-primary text-white transition-[width] duration-300 lg:flex"
  [class]="collapsed() ? 'w-[4.5rem]' : 'w-60'"
  [attr.aria-label]="t.layout.mainMenu"
>
  <ng-container *ngTemplateOutlet="menu; context: { $implicit: collapsed() }" />
</nav>

<!-- Mobile / tablet drawer -->
@if (drawerOpen()) {
  <button
    type="button"
    tabindex="-1"
    class="fixed inset-0 z-40 cursor-default bg-night/50 lg:hidden"
    [attr.aria-label]="t.layout.closeMenu"
    (click)="closeDrawer()"
  ></button>
  <nav
    id="drawer"
    class="fixed inset-y-0 left-0 z-50 flex w-[min(18rem,85vw)] flex-col overflow-y-auto scrollbar-nav bg-primary text-white shadow-2xl lg:hidden"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="t.layout.mainMenu"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <button
      type="button"
      class="mx-3 mt-3 flex min-h-12 items-center gap-2 self-end rounded-panel px-3 font-semibold text-nav-ink hover:bg-white/10 hover:text-white"
      (click)="closeDrawer()"
    >
      <ng-icon name="lucideX" size="22" aria-hidden="true" />{{ t.layout.closeMenu }}
    </button>
    <ng-container *ngTemplateOutlet="menu; context: { $implicit: false }" />
  </nav>
}

<div class="flex min-w-0 flex-1 flex-col bg-bo-bg text-sm text-bo-ink">
  <!-- White top bar (mockup "Chefs") -->
  <header
    class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-bo-border bg-surface px-3 shadow-panel sm:px-5 lg:px-6"
  >
    <button
      type="button"
      class="flex size-11 items-center justify-center rounded-panel text-bo-muted hover:bg-bo-head hover:text-primary lg:hidden"
      aria-controls="drawer"
      [attr.aria-expanded]="drawerOpen()"
      [attr.aria-label]="t.layout.mainMenu"
      (click)="drawerOpen.set(true)"
    >
      <ng-icon name="lucideMenu" size="22" aria-hidden="true" />
    </button>
    <button
      type="button"
      class="hidden size-10 items-center justify-center rounded-panel text-bo-muted hover:bg-bo-head hover:text-primary lg:flex"
      [attr.aria-expanded]="!collapsed()"
      aria-label="Replier ou déplier le menu"
      (click)="collapsed.set(!collapsed())"
    >
      <ng-icon name="lucideMenu" size="20" aria-hidden="true" />
    </button>
    <app-brand [width]="120" class="lg:hidden" />

    @if (session.user(); as user) {
      <div class="ml-auto flex min-w-0 items-center gap-3 border-l border-bo-border pl-4">
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-full bg-primary font-display text-xs font-semibold text-white"
          aria-hidden="true"
          >{{ initials() }}</span
        >
        <div class="hidden min-w-0 leading-tight sm:block">
          <p class="truncate text-[0.8125rem] font-bold">
            <span class="sr-only">{{ t.layout.connectedAs }} </span>{{ user.fullName }}
          </p>
          <p class="truncate text-[0.6875rem] text-bo-muted">
            {{ roleLabel() }} · {{ roleHint() }}
          </p>
        </div>
      </div>
    }
  </header>

  <app-offline-banner />

  <main
    id="main"
    tabindex="-1"
    class="flex w-full max-w-[87.5rem] flex-1 flex-col gap-5 px-4 py-5 sm:px-6 lg:px-7 lg:py-6"
  >
    <router-outlet />
  </main>

  <footer class="border-t border-bo-border px-4 py-3 sm:px-6 lg:px-7">
    <app-iob-notice />
  </footer>
</div>

<ng-template #menu let-compact>
  <div class="flex h-16 shrink-0 items-center justify-center border-b border-white/10 px-4">
    @if (compact) {
      <app-brand variant="symbol" [onDark]="true" />
    } @else {
      <app-brand [onDark]="true" [width]="140" />
    }
  </div>
  <ul class="flex flex-1 flex-col gap-1 py-4">
    @for (item of items(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="!border-accent !bg-white/10 !text-white font-bold"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [attr.title]="compact ? item.label : null"
          class="mr-2.5 ml-2.5 flex min-h-11 items-center gap-3 rounded-r-panel border-l-[3px] border-transparent px-3 py-1.5 text-[0.8125rem] leading-tight font-medium text-nav-ink transition-colors hover:bg-white/10 hover:text-white"
          [class.justify-center]="compact"
        >
          <ng-icon [name]="item.icon" size="18" class="shrink-0" aria-hidden="true" />
          <span [class.sr-only]="compact">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
  <div class="border-t border-white/10 px-2.5 py-3">
    <button
      type="button"
      class="flex min-h-10 w-full items-center gap-3 rounded-panel px-3 text-[0.8125rem] font-semibold text-nav-ink hover:bg-white/10 hover:text-white"
      [class.justify-center]="compact"
      (click)="logout()"
    >
      <ng-icon name="lucideLogOut" size="16" class="shrink-0" aria-hidden="true" />
      <span [class.sr-only]="compact">{{ t.layout.logout }}</span>
    </button>
  </div>
</ng-template>
